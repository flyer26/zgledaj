<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZGLEDAJ</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/zg-icon.png">
    <link rel="apple-touch-icon" href="/zg-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
        /* --- TEME I BOJE --- */
        :root {
            --led-color: #ffaa00;
            --led-sched: #b37700;
            --led-dim: #2a1a00;
            --bg-color: #111;
            --glow: 0 0 4px var(--led-color), 0 0 8px var(--led-color);
            --glow-sched: 0 0 3px var(--led-sched);
            --font-main: 'VT323', monospace;
            --font-scale: 1.0; 
            --brightness: 1.0; 
            --border-style: 1px dashed var(--led-dim);
            --header-border: 3px solid var(--led-color);
            --bg-image: radial-gradient(var(--led-dim) 30%, transparent 35%);
        }

        /* ZELENA TEMA */
        body.theme-green {
            --led-color: #c0e020;
            --led-sched: #50600a;
            --led-dim: #1a2200;
            --glow: none;       
            --glow-sched: none;
            --header-border: 3px solid #c0e020; 
        }

        /* CLEAN MODE (PREGLEDNA TABLICA) */
        body.theme-clean {
            --led-color: #000000;
            --led-sched: #666666;
            --led-dim: #eeeeee;
            --bg-color: #ffffff;
            --glow: none;
            --glow-sched: none;
            --font-main: 'Roboto', sans-serif;
            --border-style: 1px solid #ddd;
            --header-border: 3px solid #000;
            --bg-image: none;
            text-shadow: none !important;
        }
        
        @media (prefers-color-scheme: dark) {
            body.theme-clean {
                --led-color: #ffffff;
                --led-sched: #aaaaaa;
                --led-dim: #333333;
                --bg-color: #121212;
                --border-style: 1px solid #333;
                --header-border: 3px solid #fff;
            }
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--led-color);
            font-family: var(--font-main);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: var(--bg-image);
            background-size: 4px 4px;
            text-shadow: var(--glow);
            transition: color 0.3s, background 0.3s;
            filter: brightness(var(--brightness));

            /* SAFE AREA ZA NOTCH */
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
        }

        /* --- BURN-IN ZAŠTITA (PIXEL SHIFT) --- */
        @keyframes pixel-shift {
            0% { transform: translate(0px, 0px); }
            25% { transform: translate(2px, 1px); }
            50% { transform: translate(0px, 2px); }
            75% { transform: translate(-2px, 1px); }
            100% { transform: translate(0px, 0px); }
        }
        .burn-in-protection {
            animation: pixel-shift 60s infinite linear;
        }

        /* --- SETUP EKRAN --- */
        #setup-screen {
            display: flex; flex-direction: column; align-items: center;
            height: 100%; background: var(--bg-color); z-index: 100; position: absolute; width: 100%; top: 0;
            background-image: inherit; 
            background-size: inherit;
            overflow-y: auto; padding: 40px 20px;
        }
        
        .input-group { position: relative; width: 80%; max-width: 500px; margin-bottom: 20px; display: flex; gap: 10px; }
        
        input[type="text"] {
            width: 100%; padding: 15px; font-size: 2rem; background: var(--bg-color);
            color: var(--led-color); border: 2px solid var(--led-color);
            border-radius: 4px; text-align: center; font-family: inherit; 
            text-transform: uppercase; box-shadow: var(--glow); outline: none;
        }
        
        /* --- CUSTOM DROPDOWN LISTA --- */
        .suggestions-box {
            display: none;
            position: absolute;
            top: 100%; left: 0; width: 100%;
            background: var(--bg-color);
            border: 2px solid var(--led-color);
            border-top: none;
            max-height: 250px;
            overflow-y: auto;
            z-index: 9999; /* Mora biti iznad svega */
            box-shadow: var(--glow);
        }
        .suggestion-item {
            padding: 15px;
            font-size: 1.5rem;
            border-bottom: 1px dashed var(--led-dim);
            cursor: pointer;
            text-transform: uppercase;
            color: var(--led-color);
            text-align: left;
        }
        @media (hover: hover) {
            .suggestion-item:hover {
                background: var(--led-dim);
            }
        }

        .btn-loc {
            padding: 0 15px; font-size: 1.5rem; cursor: pointer;
            background: var(--bg-color); color: var(--led-color);
            border: 2px solid var(--led-color); border-radius: 4px;
            box-shadow: var(--glow); font-family: inherit;
        }
        
        .option-box {
            display: none; flex-direction: column; gap: 10px; width: 80%; max-width: 500px;
            margin-bottom: 20px; background: rgba(0,0,0,0.1);
            border: var(--border-style); padding: 15px;
        }
        
        .checkbox-row {
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            font-size: 1.5rem; text-transform: uppercase;
        }
        .checkbox-row input {
            width: 25px; height: 25px; accent-color: var(--led-color); cursor: pointer;
        }
        
        #btn-start {
            display: none; font-size: 2rem; padding: 10px 40px; 
            background: var(--led-color); color: var(--bg-color); border: none; 
            cursor: pointer; font-family: inherit; font-weight: bold;
            box-shadow: var(--glow); margin-bottom: 30px;
        }

        /* --- FAVORITI LISTA STIL --- */
        #favorites-container {
            width: 80%; max-width: 500px; margin-bottom: 20px;
            display: none; flex-direction: column; gap: 10px;
        }
        .fav-item {
            display: flex; gap: 10px;
        }
        .fav-launch {
            flex-grow: 1; padding: 15px; font-size: 1.5rem; 
            background: transparent; color: var(--led-color); 
            border: 2px solid var(--led-color); cursor: pointer;
            font-family: inherit; text-transform: uppercase;
            box-shadow: var(--glow); text-align: left;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .fav-launch:hover { background: rgba(255,255,255,0.1); }
        
        .fav-delete {
            width: 50px; font-size: 1.5rem;
            background: transparent; color: var(--led-color);
            border: 2px solid var(--led-color); cursor: pointer;
            font-family: inherit; box-shadow: var(--glow);
            display: flex; align-items: center; justify-content: center;
        }
        .fav-delete:hover { background: rgba(255,0,0,0.3); color: #ff5555; border-color: #ff5555; }
        
        .disclaimer {
            margin-top: auto; padding: 20px 0; font-size: 0.8rem; opacity: 0.5; text-align: center; 
            color: var(--led-color); border-top: var(--border-style); width: 80%;
        }

        h2 { text-shadow: var(--glow); margin-bottom: 20px; font-size: 4rem; font-weight: bold; letter-spacing: 5px; }
        h3 { margin: 0 0 10px 0; font-weight: normal; opacity: 0.8; font-size: 1.5rem; border-bottom: var(--border-style); padding-bottom: 5px; }

        /* --- DISPLAY EKRAN (SCROLL LOGIKA) --- */
        #display-screen {
            display: none; flex-direction: column; height: 100%;
            padding: 10px 15px; width: 100%; max-width: 1200px; margin: 0 auto;
            will-change: transform; 
            overflow-y: auto; 
            scrollbar-width: none;  /* Firefox */
            -ms-overflow-style: none;  /* IE/Edge */
        }
        #display-screen::-webkit-scrollbar { display: none; }

        /* FULLSCREEN: Zabrani scroll osim za clean mode */
        body.fullscreen-mode:not(.theme-clean) #display-screen { overflow-y: hidden; }

        /* CLEAN MODE: Uvijek scrollbar */
        body.theme-clean #display-screen { scrollbar-width: thin; }
        body.theme-clean #display-screen::-webkit-scrollbar { display: block; width: 8px; }
        body.theme-clean #display-screen::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 4px; }

        header {
            border-bottom: var(--header-border); margin-bottom: 5px; padding-bottom: 5px;
            display: flex; justify-content: space-between; align-items: flex-end;
            flex-shrink: 0;
        }
        h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); text-transform: uppercase; line-height: 1; }
        .clock { font-size: clamp(2rem, 4vw, 3rem); opacity: 0.9; }

        .blink { animation: blinker 0.6s step-end infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        body.no-blink .blink { animation: none; opacity: 1; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0; line-height: 1.1; }
        th { 
            text-align: left; font-size: calc(1.5rem * var(--font-scale)); 
            color: var(--led-color); opacity: 0.7; padding-bottom: 5px; 
            border-bottom: var(--border-style); font-weight: normal; text-shadow: none;
        }
        td { font-size: calc(clamp(2.5rem, 6vw, 6rem) * var(--font-scale)); }

        body.theme-clean td {
            font-size: calc(clamp(1.2rem, 4vw, 2.5rem) * var(--font-scale)) !important;
            padding: 8px 0; border-bottom: 1px solid rgba(128,128,128,0.2); 
        }
        body.theme-clean th { font-size: calc(1.0rem * var(--font-scale)) !important; }

        th:nth-child(1), td:nth-child(1) { width: 15%; min-width: 50px; text-align: left; }
        th:nth-child(3), td:nth-child(3) { width: 25%; min-width: 80px; text-align: right; }
        th:nth-child(2), td:nth-child(2) { width: auto; text-align: left; }

        tr.sched td { color: var(--led-sched); text-shadow: var(--glow-sched); }
        tr.sched .vrijeme::after { content: "*"; position: relative; top: -5px; font-size: 0.6em; opacity: 0.8; margin-left: 2px; }

        /* --- KONTROLE I NOTCH FIX --- */
        .corner-controls { 
            position: fixed; 
            top: calc(10px + env(safe-area-inset-top)); 
            right: calc(10px + env(safe-area-inset-right)); 
            display: flex; gap: 10px; z-index: 200; 
            opacity: 1; visibility: visible; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .corner-controls.idle { opacity: 0; visibility: hidden; pointer-events: none; }
        body.fullscreen-mode .corner-controls { display: none !important; }

        .btn { 
            background: var(--bg-color); border: 1px solid var(--led-color); color: var(--led-color); 
            cursor: pointer; font-size: 1.2rem; padding: 5px 10px; font-family: inherit; 
            text-transform: uppercase; box-shadow: var(--glow-sched);
        }
        .btn:hover { background: var(--led-dim); }

        /* --- SETTINGS PANEL --- */
        #settings-panel {
            display: none; position: absolute; 
            top: calc(50px + env(safe-area-inset-top)); 
            right: calc(10px + env(safe-area-inset-right)); 
            
            background: var(--bg-color); border: 2px solid var(--led-color); padding: 15px;
            z-index: 201; flex-direction: column; gap: 15px; width: 320px;
            box-shadow: var(--glow);
            max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch; 
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; }
        .setting-col { display: flex; flex-direction: column; gap: 5px; }
        label { cursor: pointer; }
        input[type="range"] { width: 100%; accent-color: var(--led-color); cursor: pointer; }
        
        select {
            background: var(--bg-color); color: var(--led-color); border: 1px solid var(--led-color);
            padding: 5px; font-family: inherit; font-size: 1rem; width: 150px; text-align: right;
        }

        .val-display { font-size: 1rem; opacity: 0.8; margin-left: 10px; }
        hr { width: 100%; border: 0; border-top: var(--border-style); margin: 0; }
        #msg-box { text-align: center; font-size: 2rem; margin-top: 20vh; color: var(--led-dim); display: none; text-shadow: none; }

        @media (max-width: 1000px) {
            .corner-controls {
                position: static !important; width: 100% !important; display: flex; 
                justify-content: flex-end !important; padding: 10px !important; 
                background-color: var(--bg-color); margin-bottom: 5px !important;
                z-index: 9999; flex-shrink: 0;
            }
            .btn { font-size: 1.1rem; padding: 6px 12px; margin-left: 5px; }
            #display-screen { height: auto !important; flex: 1 !important; padding-top: 0 !important; overflow: hidden; }
            #setup-screen { top: auto !important; position: relative !important; padding-top: 20px; }
            #settings-panel { width: 90%; right: 5%; top: 60px; }
        }
        
        :fullscreen .corner-controls, :-webkit-full-screen .corner-controls, :-moz-full-screen .corner-controls { display: none !important; }
    </style>
</head>
<body>

    <div class="corner-controls" id="main-controls">
        <button class="btn" onclick="toggleSettings()">OPCIJE</button>
        <button class="btn" onclick="toggleFullScreen()">FULLSCREEN</button>
        <button class="btn" onclick="exitKiosk()">X</button>
    </div>

    <div id="settings-panel">
        <div class="setting-row">
            <label for="sel-theme">DIZAJN EKRANA:</label>
            <select id="sel-theme" onchange="updateSettings()">
                <option value="orange">NARANČASTI LED</option>
                <option value="green">ZELENI DOT</option>
                <option value="clean">PREGLEDNA TABLICA</option>
            </select>
        </div>
        <div class="setting-row">
            <label for="chk-blink">BLINKANJE</label>
            <input type="checkbox" id="chk-blink" checked onchange="updateSettings()">
        </div>
        <div class="setting-row">
            <label for="chk-sad">PIŠI "SAD"</label>
            <input type="checkbox" id="chk-sad" onchange="updateSettings()">
        </div>
        <div class="setting-row">
            <label for="chk-burnin">BURN-IN ZAŠTITA</label>
            <input type="checkbox" id="chk-burnin" onchange="updateSettings()">
        </div>
        <hr>
        <button class="btn" style="width:100%; color: var(--led-sched); border-color: var(--led-sched);" onclick="clearAllFavorites()">OBRIŠI SVE FAVORITE</button>
        <hr>
        <div class="setting-col">
            <div style="display:flex; justify-content:space-between;">
                <label>SVJETLINA:</label>
                <span id="disp-bright" class="val-display">100%</span>
            </div>
            <input type="range" id="rng-bright" min="10" max="100" value="100" step="5" oninput="updateSettings()">
        </div>
        <div class="setting-col">
            <div style="display:flex; justify-content:space-between;">
                <label>BROJ REDAKA:</label>
                <span id="disp-rows" class="val-display">15</span>
            </div>
            <input type="range" id="rng-rows" min="3" max="30" value="15" oninput="updateSettings()">
        </div>
        <div class="setting-col">
            <div style="display:flex; justify-content:space-between;">
                <label>VELIČINA SLOVA:</label>
                <span id="disp-font" class="val-display">100%</span>
            </div>
            <input type="range" id="rng-font" min="50" max="150" value="100" step="5" oninput="updateSettings()">
        </div>
        <hr>
        <button class="btn" style="width:100%" onclick="toggleSettings()">ZATVORI</button>
    </div>

    <div id="setup-screen">
        <h2>ZGLEDAJ</h2> 
        
        <div class="input-group">
            <input type="text" id="station-input" placeholder="UPIŠI STANICU..." 
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <button class="btn-loc" onclick="locateMe()" title="Lociraj me">📍</button>
            
            <div id="custom-suggestions" class="suggestions-box"></div>
        </div>
        
        <div id="favorites-container"></div>

        <div id="direction-selector" class="option-box">
            <h3>SMJEROVI:</h3>
            <div id="checkbox-container"></div>
            <div style="margin-top: 5px; font-size: 0.9rem; opacity: 0.7; text-align: center;">(Prazno = SVI SMJEROVI)</div>
        </div>

        <div id="vehicle-selector" class="option-box">
            <h3>PRIKAŽI:</h3>
            <div class="checkbox-row">
                <input type="checkbox" id="setup-chk-trams" checked>
                <span>TRAMVAJI</span>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="setup-chk-buses" checked>
                <span>AUTOBUSI</span>
            </div>
        </div>

        <div id="favorite-box" class="option-box" style="display:none; align-items:center;">
             <div class="checkbox-row">
                <input type="checkbox" id="chk-save-fav">
                <span style="font-size: 1.2rem">ZAPAMTI KAO FAVORIT</span>
            </div>
        </div>

        <button id="btn-start" onclick="finalizeSetup()">POKRENI DISPLAY</button>
        
        <div class="disclaimer">
            Nezavisna aplikacija. Autor ne odgovara za točnost podataka.<br>
            Podaci o stanicama i postavkama spremaju se isključivo lokalno na vaš uređaj.
        </div>
    </div>

    <div id="display-screen">
        <header>
            <h1 id="station-title">...</h1>
            <div class="clock" id="clock">00:00</div>
        </header>
        <table>
            <thead>
                <tr>
                    <th>LINIJA</th>
                    <th>ODREDIŠTE</th>
                    <th style="text-align: right">DOLAZAK</th>
                </tr>
            </thead>
            <tbody id="board"></tbody>
        </table>
        <div id="msg-box">NEMA NAJAVA</div>
    </div>

    <script>
        // --- 1. VERZIONIRANJE I AUTO-UPDATE ---
        const CURRENT_VERSION = "1.2"; 
        const savedVersion = localStorage.getItem('zet_app_version');

        if (savedVersion !== CURRENT_VERSION) {
            console.log("Detektirana nova verzija! Primjenjujem zakrpe...");
            
            // Popravi postavke (isključi blinkanje po defaultu za v1.1)
            let existingSettings = localStorage.getItem('zet_settings');
            if (existingSettings) {
                let parsed = JSON.parse(existingSettings);
                parsed.blinking = false; 
                localStorage.setItem('zet_settings', JSON.stringify(parsed));
            }

            // Očisti stari Service Worker da povuče novi kod
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) {
                        registration.unregister();
                    }
                });
            }

            localStorage.setItem('zet_app_version', CURRENT_VERSION);
            window.location.reload();
        }

        // --- GLAVNI KOD ---
        let settings = { 
            theme: 'orange', 
            blinking: false, 
            useSadText: false, 
            maxRows: 15, 
            fontSize: 100,
            showTrams: true,
            showBuses: true,
            brightness: 100, 
            burnInProtection: false 
        };
        
        let allStations = []; 
        let activeFilters = []; 
        let selectedStationName = ""; 
        let idleTimer; 
        let favoritesList = []; // Nova lista favorita
        let fetchInterval = null; 

        function loadSettings() {
            const saved = localStorage.getItem('zet_settings');
            if (saved) {
                settings = { ...settings, ...JSON.parse(saved) };
            }
            
            if (settings.cleanMode) { settings.theme = 'clean'; delete settings.cleanMode; }
            if (settings.greenMode) { settings.theme = 'green'; delete settings.greenMode; }

            document.getElementById('sel-theme').value = settings.theme || 'orange';
            document.getElementById('chk-blink').checked = settings.blinking;
            document.getElementById('chk-sad').checked = settings.useSadText;
            document.getElementById('chk-burnin').checked = settings.burnInProtection;

            document.getElementById('rng-rows').value = settings.maxRows || 15;
            document.getElementById('disp-rows').innerText = settings.maxRows || 15;
            document.getElementById('rng-font').value = settings.fontSize || 100;
            document.getElementById('disp-font').innerText = (settings.fontSize || 100) + "%";
            document.getElementById('rng-bright').value = settings.brightness || 100;
            document.getElementById('disp-bright').innerText = (settings.brightness || 100) + "%";
            
            applyStyles();
            loadFavorites(); // Učitaj listu favorita
            resetIdleTimer(); 
        }

        function loadFavorites() {
            // MIGRACIJA: Ako postoji stari "jedan" favorit, prebaci ga u listu
            const oldFav = localStorage.getItem('zet_favorite_station');
            const newList = localStorage.getItem('zet_favorites_list');

            if (oldFav && !newList) {
                favoritesList = [JSON.parse(oldFav)];
                localStorage.setItem('zet_favorites_list', JSON.stringify(favoritesList));
                localStorage.removeItem('zet_favorite_station'); // Obriši stari
            } else if (newList) {
                favoritesList = JSON.parse(newList);
            } else {
                favoritesList = [];
            }

            renderFavoritesUI();
        }

        function renderFavoritesUI() {
            const container = document.getElementById('favorites-container');
            container.innerHTML = '';

            if (favoritesList.length > 0) {
                container.style.display = 'flex';
                favoritesList.forEach((fav, index) => {
                    const row = document.createElement('div');
                    row.className = 'fav-item';

                    // Gumb za pokretanje
                    const btn = document.createElement('button');
                    btn.className = 'fav-launch';
                    btn.innerHTML = "⭐ " + fav.name;
                    btn.onclick = () => launchFavorite(index);

                    // Gumb za brisanje (X)
                    const delBtn = document.createElement('button');
                    delBtn.className = 'fav-delete';
                    delBtn.innerHTML = "X";
                    delBtn.onclick = () => deleteFavorite(index);

                    row.appendChild(btn);
                    row.appendChild(delBtn);
                    container.appendChild(row);
                });
            } else {
                container.style.display = 'none';
            }
        }

        function launchFavorite(index) {
            const fav = favoritesList[index];
            if (fav) {
                selectedStationName = fav.name;
                activeFilters = fav.filters || [];
                settings.showTrams = fav.showTrams;
                settings.showBuses = fav.showBuses;
                
                document.getElementById('setup-chk-trams').checked = settings.showTrams;
                document.getElementById('setup-chk-buses').checked = settings.showBuses;
                
                updateSettings(false);
                
                let newUrl = `?station=${encodeURIComponent(selectedStationName)}`;
                if (activeFilters.length > 0) newUrl += `&filter=${encodeURIComponent(activeFilters.join(','))}`;
                window.history.pushState({}, '', newUrl);
                
                enterKiosk(selectedStationName);
            }
        }

        function deleteFavorite(index) {
            if (confirm("Obrisati ovaj favorit?")) {
                favoritesList.splice(index, 1); // Izbaci iz niza
                localStorage.setItem('zet_favorites_list', JSON.stringify(favoritesList));
                renderFavoritesUI();
            }
        }

        function clearAllFavorites() {
            if (confirm("Sigurno želiš obrisati SVE favorite?")) {
                favoritesList = [];
                localStorage.removeItem('zet_favorites_list');
                localStorage.removeItem('zet_favorite_station');
                renderFavoritesUI();
                alert("Svi favoriti obrisani.");
                toggleSettings();
            }
        }

        function resetIdleTimer() {
            if (document.body.classList.contains('fullscreen-mode')) return;
            const controls = document.getElementById('main-controls');
            controls.classList.remove('idle');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                document.getElementById('settings-panel').style.display = 'none';
                controls.classList.add('idle');
            }, 5000);
        }

        ['mousemove', 'mousedown', 'touchstart', 'click', 'keydown'].forEach(evt => 
            document.addEventListener(evt, resetIdleTimer)
        );

        function updateSettings(shouldRender = true) {
            settings.theme = document.getElementById('sel-theme').value;
            settings.blinking = document.getElementById('chk-blink').checked;
            settings.useSadText = document.getElementById('chk-sad').checked;
            settings.burnInProtection = document.getElementById('chk-burnin').checked;
            
            settings.maxRows = parseInt(document.getElementById('rng-rows').value);
            document.getElementById('disp-rows').innerText = settings.maxRows;
            
            settings.fontSize = parseInt(document.getElementById('rng-font').value);
            document.getElementById('disp-font').innerText = settings.fontSize + "%";
            
            settings.brightness = parseInt(document.getElementById('rng-bright').value);
            document.getElementById('disp-bright').innerText = settings.brightness + "%";
            
            localStorage.setItem('zet_settings', JSON.stringify(settings));
            applyStyles();
            
            if(shouldRender && window.lastData) renderBoard(window.lastData);
        }

        function applyStyles() {
            document.body.classList.remove('theme-green', 'theme-clean');
            if (settings.theme === 'green') document.body.classList.add('theme-green');
            if (settings.theme === 'clean') document.body.classList.add('theme-clean');

            !settings.blinking ? document.body.classList.add('no-blink') : document.body.classList.remove('no-blink');
            
            const display = document.getElementById('display-screen');
            if(settings.burnInProtection) {
                display.classList.add('burn-in-protection');
            } else {
                display.classList.remove('burn-in-protection');
            }

            document.documentElement.style.setProperty('--font-scale', settings.fontSize / 100);
            document.documentElement.style.setProperty('--brightness', settings.brightness / 100);
        }

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
            resetIdleTimer();
        }

        const urlParams = new URLSearchParams(window.location.search);
        let urlStation = urlParams.get('station');
        let urlFilter = urlParams.get('filter'); 

        loadSettings();

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('hr-HR', {hour:'2-digit', minute:'2-digit'});
        }, 1000);

        fetch('/api/stations').then(r => r.json()).then(data => {
            allStations = data; 
        });

        const stationInput = document.getElementById('station-input');
        const suggestionsBox = document.getElementById('custom-suggestions');

        stationInput.addEventListener('input', (e) => {
            const val = e.target.value.trim().toLowerCase();
            suggestionsBox.innerHTML = ''; 

            if (!val) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const matches = allStations.filter(s => s.toLowerCase().includes(val));

            if (matches.length > 0) {
                matches.slice(0, 10).forEach(station => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = station;
                    
                    const selectFn = (e) => {
                        e.preventDefault(); 
                        selectStation(station);
                    };
                    div.addEventListener('mousedown', selectFn);
                    div.addEventListener('touchstart', selectFn);
                    
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
        });

        async function selectStation(name) {
            stationInput.value = name;
            selectedStationName = name;
            suggestionsBox.style.display = 'none'; 
            await showDirectionSelector(name);
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.input-group')) {
                suggestionsBox.style.display = 'none';
            }
        });

        function locateMe() {
            if (!navigator.geolocation) {
                alert("Geolokacija nije podržana.");
                return;
            }
            stationInput.placeholder = "TRAŽIM...";
            const options = { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 };

            navigator.geolocation.getCurrentPosition(async (position) => {
                try {
                    const res = await fetch(`/api/nearest?lat=${position.coords.latitude}&lon=${position.coords.longitude}`);
                    const data = await res.json();
                    if (data.name) {
                        selectStation(data.name); 
                    } else {
                        alert("Nema stanice u blizini (5km).");
                        stationInput.placeholder = "UPIŠI STANICU...";
                    }
                } catch (e) {
                    console.error(e);
                    stationInput.placeholder = "GREŠKA";
                }
            }, (error) => {
                let msg = "Greška lokacije.";
                if(window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') msg += " (Mora biti HTTPS)";
                alert(msg);
                stationInput.placeholder = "UPIŠI STANICU...";
            }, options);
        }

        async function showDirectionSelector(stationName) {
            try {
                const res = await fetch(`/api/destinations?station=${encodeURIComponent(stationName)}`);
                const destinations = await res.json();
                
                const container = document.getElementById('checkbox-container');
                container.innerHTML = ''; 

                if (destinations.length === 0) {
                    container.innerHTML = '<div style="color:var(--led-sched)">Nema aktivnih linija.<br>Pritisni POKRENI svejedno.</div>';
                } else {
                    destinations.forEach(dest => {
                        const row = document.createElement('label');
                        row.className = 'checkbox-row';
                        const chk = document.createElement('input');
                        chk.type = 'checkbox';
                        chk.value = dest;
                        chk.checked = false; 
                        const txt = document.createElement('span');
                        txt.innerText = dest;
                        row.appendChild(chk);
                        row.appendChild(txt);
                        container.appendChild(row);
                    });
                }
                
                document.getElementById('direction-selector').style.display = 'flex';
                document.getElementById('vehicle-selector').style.display = 'flex';
                document.getElementById('favorite-box').style.display = 'flex'; 
                document.getElementById('btn-start').style.display = 'block';

            } catch (e) { console.error(e); }
        }

        function finalizeSetup() {
            const checkboxes = document.querySelectorAll('#checkbox-container input[type="checkbox"]:checked');
            activeFilters = Array.from(checkboxes).map(cb => cb.value);
            
            settings.showTrams = document.getElementById('setup-chk-trams').checked;
            settings.showBuses = document.getElementById('setup-chk-buses').checked;
            updateSettings(false);

            // --- LOGIKA ZA SPREMANJE FAVORITA ---
            if (document.getElementById('chk-save-fav').checked) {
                const newFav = {
                    name: selectedStationName,
                    filters: activeFilters,
                    showTrams: settings.showTrams,
                    showBuses: settings.showBuses
                };

                // Provjeri postoji li već (po imenu)
                const existingIndex = favoritesList.findIndex(f => f.name === selectedStationName);

                if (existingIndex >= 0) {
                    // Ažuriraj postojeći
                    favoritesList[existingIndex] = newFav;
                    localStorage.setItem('zet_favorites_list', JSON.stringify(favoritesList));
                    renderFavoritesUI();
                } else {
                    // Dodaj novi ako ima mjesta
                    if (favoritesList.length >= 5) {
                        alert("Moguće je spremiti maksimalno 5 favorita! Obrišite neki prije spremanja novog.");
                        // Ne spremamo, ali nastavljamo s pokretanjem displaya
                    } else {
                        favoritesList.push(newFav);
                        localStorage.setItem('zet_favorites_list', JSON.stringify(favoritesList));
                        renderFavoritesUI();
                    }
                }
            }
            
            let newUrl = `?station=${encodeURIComponent(selectedStationName)}`;
            if (activeFilters.length > 0) newUrl += `&filter=${encodeURIComponent(activeFilters.join(','))}`;
            
            window.history.pushState({}, '', newUrl);
            enterKiosk(selectedStationName);
        }

        function enterKiosk(stationName) {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('display-screen').style.display = 'flex';
            
            const decoded = decodeURIComponent(stationName);
            const displayName = decoded.replace(/\s\(\d+\)$/, ''); 
            
            document.getElementById('station-title').innerText = displayName;
            document.title = displayName;
            startBoard(decoded);
        }

        function exitKiosk() { 
            if (fetchInterval) clearInterval(fetchInterval);
            
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('display-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
            document.title = "ZGLEDAJ";
        }

        function toggleFullScreen() { 
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.body.classList.add('fullscreen-mode');
            } else {
                document.exitFullscreen();
                document.body.classList.remove('fullscreen-mode');
            }
        }
        
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('fullscreen-mode');
            }
        });

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                if (fetchInterval) clearInterval(fetchInterval);
            } else {
                if (document.getElementById('display-screen').style.display === 'flex') {
                    const stationToRefresh = selectedStationName || document.getElementById('station-title').innerText;
                    if (stationToRefresh && stationToRefresh !== "...") {
                        startBoard(stationToRefresh);
                    }
                }
            }
        });

        function startBoard(stationName) {
            if (fetchInterval) clearInterval(fetchInterval);
            selectedStationName = stationName;

            const fetchData = async () => {
                try {
                    const res = await fetch(`/api/board?station=${encodeURIComponent(stationName)}`);
                    const data = await res.json();
                    window.lastData = data;
                    renderBoard(data);
                } catch(e) { console.error(e); }
            };
            fetchData();
            fetchInterval = setInterval(fetchData, 10000);
        }

        function isTram(linija) {
            const num = parseInt(linija);
            if (isNaN(num)) return false; 
            return num < 100;
        }

        function renderBoard(data) {
            const tbody = document.getElementById('board');
            tbody.innerHTML = '';
            
            const uniqueData = [];
            const seen = new Set();

            data.forEach(d => {
                const signature = `${d.linija}-${d.smjer}-${d.time}-${d.min}`;
                if (!seen.has(signature)) {
                    seen.add(signature);
                    uniqueData.push(d);
                }
            });
            
            let filteredData = uniqueData; 
            
            if (activeFilters.length > 0) {
                filteredData = filteredData.filter(d => activeFilters.includes(d.smjer));
            }

            filteredData = filteredData.filter(d => {
                const isT = isTram(d.linija);
                if (settings.showTrams && isT) return true;
                if (settings.showBuses && !isT) return true;
                return false;
            });

            if (filteredData.length === 0) {
                document.getElementById('msg-box').style.display = 'block';
                if (uniqueData.length > 0) {
                    document.getElementById('msg-box').innerText = "NEMA ODABRANIH VOZILA";
                } else {
                    document.getElementById('msg-box').innerText = "NEMA NAJAVA";
                }
            } else {
                document.getElementById('msg-box').style.display = 'none';
                
                const limit = settings.maxRows || 15;
                
                filteredData.slice(0, limit).forEach(d => {
                    let minText = d.min + " min";
                    let rowClass = (d.status === "SCHED") ? "sched" : ""; 
                    if (d.status === "LIVE" && d.min <= 0) {
                        minText = settings.useSadText ? "SAD" : "<<<"; 
                        rowClass += " blink";
                    } else if (d.status === "SCHED") {
                        minText = d.time; 
                    }
                    tbody.innerHTML += `<tr class="${rowClass}"><td class="linija">${d.linija}</td><td class="smjer">${d.smjer}</td><td class="vrijeme">${minText}</td></tr>`;
                });
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
